id = "teletap/pi"
version = "0.2.2"
api = "1.3"
kind = "provider"
scope = "personal"
description = "Connects Pi to teletap: an extension that serves the session's inbox and runs its hooks."

[provider]
agent = "pi"
name = "Pi"
install_env = ["PI_CODING_AGENT_DIR"]
skill = [
  "{config_dir}/skills/teletap/SKILL.md",
  "${PI_CODING_AGENT_DIR}/skills/teletap/SKILL.md",
  "~/.pi/agent/skills/teletap/SKILL.md",
]

[provider.session]
processes = ["pi"]

[provider.detect]
commands = ["pi"]

[permissions.door]
fs_write = [
  "~/.pi/agent/extensions/teletap.ts",
  "{config_dir}/extensions/teletap.ts",
  "${PI_CODING_AGENT_DIR}/extensions/teletap.ts",
  # A cloud agent's run: the extension in the run's own folder.
  "{run_dir}/extensions/teletap.ts",
]
