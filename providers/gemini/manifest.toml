id = "teletap/gemini"
version = "0.3.0"
api = "1.1"
kind = "provider"
scope = "personal"
description = "Connects Gemini CLI to teletap: hooks and the teletap MCP server."

[provider]
agent = "gemini"
name = "Gemini CLI"
install_env = ["GEMINI_CLI_HOME"]
skill = [
  "{config_dir}/skills/teletap/SKILL.md",
  "${GEMINI_CLI_HOME}/.gemini/skills/teletap/SKILL.md",
  "~/.gemini/skills/teletap/SKILL.md",
]

[provider.session]
processes = ["gemini"]

[provider.detect]
commands = ["gemini"]

[permissions.door]
fs_write = [
  "~/.gemini/settings.json",
  "{config_dir}/settings.json",
  "${GEMINI_CLI_HOME}/.gemini/settings.json",
]
