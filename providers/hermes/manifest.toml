id = "teletap/hermes"
version = "0.1.2"
api = "1.1"
kind = "provider"
scope = "personal"
description = "Connects Hermes Agent to teletap: a plugin that serves the session's inbox and runs its hooks."

[provider]
agent = "hermes"
name = "Hermes"
install_env = ["HERMES_HOME"]
skill = [
  "{config_dir}/skills/teletap/SKILL.md",
  "${HERMES_HOME}/skills/teletap/SKILL.md",
  "~/.hermes/skills/teletap/SKILL.md",
]

[provider.session]
processes = ["hermes"]

[provider.detect]
commands = ["hermes"]

[permissions.door]
# Hermes loads a user plugin once it is enabled (and allowed to start turns);
# uninstall turns it off again.
exec = [
  "hermes plugins enable teletap",
  "hermes config set plugins.entries.teletap.allow_gateway_injection true",
  "hermes plugins disable teletap",
]
# The plugin folder itself goes on uninstall.
fs_write = [
  "~/.hermes/plugins/teletap",
  "~/.hermes/plugins/teletap/plugin.yaml",
  "~/.hermes/plugins/teletap/__init__.py",
  "{config_dir}/plugins/teletap",
  "{config_dir}/plugins/teletap/plugin.yaml",
  "{config_dir}/plugins/teletap/__init__.py",
  "${HERMES_HOME}/plugins/teletap",
  "${HERMES_HOME}/plugins/teletap/plugin.yaml",
  "${HERMES_HOME}/plugins/teletap/__init__.py",
]
