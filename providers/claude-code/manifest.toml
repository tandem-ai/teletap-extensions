id = "teletap/claude-code"
version = "0.3.1"
api = "1.3"
kind = "provider"
scope = "personal"
description = "Connects Claude Code to teletap: hooks, the /teletap skill, the teletap and teletap-ext MCP servers and permissions."

[provider]
agent = "claude"
name = "Claude Code"
install_env = ["CLAUDE_CONFIG_DIR"]
hook_env = ["CLAUDE_CODE_MESSAGING_SOCKET", "CLAUDE_CODE_MESSAGING_TOKEN"]

[provider.session]
processes = ["claude"]

[provider.detect]
commands = ["claude"]

[permissions.door]
# The user-scope MCP server goes through Claude's own CLI when no config
# dir is given: a running Claude rewrites .claude.json all the time.
exec = [
  "claude mcp add-json --scope user teletap",
  "claude mcp remove --scope user teletap",
  "claude mcp add-json --scope user teletap-ext",
  "claude mcp remove --scope user teletap-ext",
]
fs_write = [
  "~/.claude/settings.json",
  "~/.claude.json",
  "{config_dir}/settings.json",
  "{config_dir}/.claude.json",
  "${CLAUDE_CONFIG_DIR}/settings.json",
  "${CLAUDE_CONFIG_DIR}/.claude.json",
  # The /teletap skill: its file, and its folder (removed on uninstall).
  "~/.claude/skills/teletap",
  "~/.claude/skills/teletap/SKILL.md",
  "{config_dir}/skills/teletap",
  "{config_dir}/skills/teletap/SKILL.md",
  "${CLAUDE_CONFIG_DIR}/skills/teletap",
  "${CLAUDE_CONFIG_DIR}/skills/teletap/SKILL.md",
  # A cloud agent's run: its MCP servers, in the run's own folder.
  "{run_dir}/mcp.json",
]
