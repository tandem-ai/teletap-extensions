id = "teletap/codex"
version = "0.4.0"
api = "1.1"
kind = "provider"
scope = "personal"
description = "Connects Codex to teletap: trusted hooks and the teletap MCP server."

[provider]
agent = "codex"
name = "Codex"
install_env = ["CODEX_HOME"]
# Codex's own skills folder ($CODEX_HOME/skills; it calls it deprecated
# in favour of ~/.agents/skills, which Gemini, Pi and Cursor read too).
skill = [
  "{config_dir}/skills/teletap/SKILL.md",
  "${CODEX_HOME}/skills/teletap/SKILL.md",
  "~/.codex/skills/teletap/SKILL.md",
]

[provider.session]
processes = ["codex"]
# `codex app-server …` runs every chat's tools: reaching it means no one chat.
hosts = ["app-server"]
# Its shell names the chat (thread) a command runs for.
chat_env = "CODEX_THREAD_ID"
# Its MCP servers can't tell which chat calls them; its shell can.
send = "shell"

[provider.detect]
commands = ["codex"]

[permissions.door]
# One file: hooks, their trust and the MCP server all live in config.toml.
fs_write = [
  "~/.codex/config.toml",
  "{config_dir}/config.toml",
  "${CODEX_HOME}/config.toml",
]
